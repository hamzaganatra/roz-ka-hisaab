name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roz-ka-hisaab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release and keep a copy in the repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Roz-Ka-Hisaab.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Roz-Ka-Hisaab.apk --title "Roz Ka Hisaab APK" --notes "Download Roz-Ka-Hisaab.apk and install it on your phone." --target "${{ github.sha }}"
          mkdir -p dist
          cp Roz-Ka-Hisaab.apk dist/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dist/Roz-Ka-Hisaab.apk
          git commit -m "Add built APK" || true
          git push || true
